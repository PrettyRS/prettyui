name: Release plugin

on:
  release:
    types: [published]
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.pull_request.head.ref || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    # Only execute merged PR code after it has entered the trusted main branch.
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      EVENT_TAG: ${{ github.event.release.tag_name || github.ref_name }}
      RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
      RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.event.release.tag_name || github.ref_name }}
          fetch-depth: 0

      - name: Prepare release metadata
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == pull_request_target ]]; then
            tag=$(python3 .github/scripts/validate_release.py "$RELEASE_BRANCH")
            python3 -c 'import json, os; from pathlib import Path; event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text()); Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(event["pull_request"]["body"] or "", encoding="utf-8")'
            existing_tag=$(git ls-remote origin "refs/tags/$tag")
            if [[ -n "$existing_tag" ]]; then
              git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
              if [[ $(git rev-parse "refs/tags/$tag^{commit}") != "$RELEASE_COMMIT" ]]; then
                echo "Tag $tag already exists at a different commit; refusing to publish." >&2
                exit 1
              fi
            fi
          else
            tag="$EVENT_TAG"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Build and attach plugin ZIP
        id: package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="PrettyUI-${RELEASE_TAG}.zip"
          python3 .github/scripts/package_release.py "$RELEASE_TAG" --output "$asset"
          flags=()
          version="${RELEASE_TAG#v}"
          if [[ "${version%%+*}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$EVENT_NAME" == pull_request_target ]]; then
              gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
            else
              gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
            fi
          elif [[ "$EVENT_NAME" == pull_request_target ]]; then
            gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" "$asset" --clobber
          echo "prerelease=$(gh release view "$RELEASE_TAG" --json isPrerelease --jq '.isPrerelease')" >> "$GITHUB_OUTPUT"

      - name: Publish plugin ZIP to mod.io
        if: steps.package.outputs.prerelease == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODIO_ACCESS_TOKEN: ${{ secrets.MODIO_ACCESS_TOKEN }}
          MODIO_GAME_ID: ${{ vars.MODIO_GAME_ID }}
        run: |
          : "${MODIO_ACCESS_TOKEN:?Set the MODIO_ACCESS_TOKEN repository secret}"
          : "${MODIO_GAME_ID:?Set the MODIO_GAME_ID repository variable to the numeric game ID for RuneScape}"
          gh release view "$RELEASE_TAG" --json body --jq '.body' > "$RUNNER_TEMP/modio-release-notes.md"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $MODIO_ACCESS_TOKEN" \
            --form "filedata=@PrettyUI-${RELEASE_TAG}.zip;type=application/zip" \
            --form-string "version=${RELEASE_TAG#v}" \
            --form "changelog=<$RUNNER_TEMP/modio-release-notes.md" \
            --form-string "platforms[]=windows" \
            --form-string "platforms[]=mac" \
            --form-string "platforms[]=linux" \
            --form-string "active=true" \
            "https://api.mod.io/v1/games/${MODIO_GAME_ID}/mods/6398181/files"
