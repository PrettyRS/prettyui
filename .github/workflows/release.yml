name: Release plugin

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Build and attach plugin ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="PrettyUI-${RELEASE_TAG}.zip"
          python3 .github/scripts/package_release.py "$RELEASE_TAG" --output "$asset"
          gh release upload "$RELEASE_TAG" "$asset" --clobber
