name: Lua quality report

on:
  workflow_run:
    workflows: [PR tests]
    types: [completed]

permissions: {}

jobs:
  comment:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    concurrency:
      group: lua-quality-report-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
    steps:
      # workflow_run uses the default branch. Never check out or execute the PR here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Update Lua quality report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/report_lua_quality.py
